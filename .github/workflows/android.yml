# 1) Ανεβάζει τον μεσάζοντα στο Cloudflare (αν υπάρχουν τα μυστικά).
# 2) Χτίζει το αρχείο εγκατάστασης Android (APK).
# Το APK βρίσκεται στο Actions → τελευταία εκτέλεση → Artifacts → kafsima-apk
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ανέβασμα μεσάζοντα στο Cloudflare
        id: worker
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Διεύθυνση μεσάζοντα μέσα στην εφαρμογή
        env:
          AI_URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          TOKEN=$(grep -oP 'APP_TOKEN\s*=\s*"\K[^"]+' worker/wrangler.toml)
          URL="${AI_URL%/}"
          if [ -n "$URL" ]; then
            curl -fsS "$URL/" && echo " ← ο μεσάζοντας απαντάει"
          else
            echo "::warning::Δεν υπάρχουν τα μυστικά του Cloudflare. Η εφαρμογή θα ζητάει δικό της κλειδί Gemini."
          fi
          printf 'window.KAFSIMA_CONFIG = { aiUrl: "%s", appToken: "%s" };\n' "$URL" "$TOKEN" > www/config.js
          cat www/config.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Εγκατάσταση πακέτων
        run: npm install

      - name: Δημιουργία Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Χτίσιμο APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ανέβασμα APK
        uses: actions/upload-artifact@v4
        with:
          name: kafsima-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
