# Χτίζει το αρχείο εγκατάστασης Android (APK) online, κάθε φορά που ανεβαίνει αλλαγή.
# Το APK βρίσκεται στο Actions → τελευταία εκτέλεση → Artifacts → kafsima-apk
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Εγκατάσταση πακέτων
        run: npm install

      - name: Δημιουργία Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Χτίσιμο APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ανέβασμα APK
        uses: actions/upload-artifact@v4
        with:
          name: kafsima-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
